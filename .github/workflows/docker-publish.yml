name: Build and Publish Docker Image

on:
  push:
    branches:
      - "main"
      - "dev"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Necesario para guardar el tag contador de cada rama
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate independent version
        id: version
        run: |
          git fetch --tags --force

          if [ "${{ github.ref_name }}" == "main" ]; then
            PREFIX="27.0.0."
            EXTRA_TAG="latest"
          else
            PREFIX="1.0.0."
            EXTRA_TAG="dev"
          fi

          # Busca el último tag con ese prefijo y extrae el número final
          LAST_NUM=$(git tag -l "${PREFIX}*" | sed "s/^${PREFIX}//" | sort -n | tail -n 1)

          if [ -z "$LAST_NUM" ]; then
            NEXT_NUM=1
          else
            NEXT_NUM=$((LAST_NUM + 1))
          fi

          NEW_VERSION="${PREFIX}${NEXT_NUM}"
          echo "version=${NEW_VERSION}" >> $GITHUB_OUTPUT
          echo "extra=${EXTRA_TAG}" >> $GITHUB_OUTPUT

          # Crea y sube el tag en Git para recordar el contador en el siguiente push
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${NEW_VERSION}"
          git push origin "${NEW_VERSION}"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.actor }}/spain2actual:${{ steps.version.outputs.extra }}
            ghcr.io/${{ github.actor }}/spain2actual:${{ steps.version.outputs.version }}
